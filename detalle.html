<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle | Metal Costa Rica</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .detail-page { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .detail-header { display: grid; grid-template-columns: 400px 1fr; gap: 40px; margin-bottom: 40px; }
        .detail-img { width: 100%; border-radius: 12px; border: 2px solid #222; }
        .detail-info h1 { font-size: 3.5rem; margin: 0 0 10px 0; }
        .detail-meta { color: var(--accent-purple); font-size: 1.2rem; margin-bottom: 20px; }
        .section-title { border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 40px; color: var(--accent-red); }
        .videos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .video-item { background: #111; padding: 10px; border-radius: 8px; text-align: center; color: #777; }
        .social-links { margin-top: 20px; display: flex; gap: 15px; }
        .social-link { color: #ccc; text-decoration: none; border: 1px solid #333; padding: 8px 15px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="parent" style="display: block;">
    <div class="detail-page" id="detailContainer">
        <p>Cargando detalles...</p>
    </div>
</div>

<script>
    const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
        ? "http://localhost:3000" 
        : "https://metal-cr-frontend-2.onrender.com"; 
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    const id = urlParams.get('id');

    async function loadDetail() {
        if (!id) return;
        try {
            let endpoint = "";
            if (type === 'band') endpoint = `bandas/${id}`;
            else if (type === 'story') endpoint = `historias/${id}`;
            else if (type === 'place') endpoint = `lugares/${id}`;

            const res = await fetch(`${API_BASE}/${endpoint}`);
            const data = await res.json();
            
            if (data.error) {
                document.getElementById('detailContainer').innerHTML = `<h1>Error: ${data.error}</h1>`;
                return;
            }

            renderDetail(data);
        } catch (e) {
            console.error(e);
        }
    }

    // Prefija rutas de servidor con la URL base para que funcionen desde el filesystem
    function imgUrl(url) {
        if (!url) return '';
        if (url.startsWith('/uploads/') || url.startsWith('/imagenes/')) {
            return API_BASE + url;
        }
        return url;
    }

    function getYoutubeEmbed(url) {
        if (!url) return '';
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        if (match && match[2].length === 11) {
            const videoId = match[2];
            // Usamos youtube-nocookie para mayor compatibilidad de embeds
            return `
                <div style="position:relative;">
                    <iframe 
                        id="yt-iframe"
                        width="100%" height="315" 
                        src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0" 
                        frameborder="0" allowfullscreen
                        onerror="this.style.display='none'; document.getElementById('yt-fallback').style.display='block'">
                    </iframe>
                    <div id="yt-fallback" style="display:none; text-align:center; padding:30px; background:#111; border-radius:12px; border:1px solid #333;">
                        <p style="color:#999; margin-bottom:15px;">⚠️ Este video no permite reproducción embebida.</p>
                        <a href="${url}" target="_blank" 
                           style="background:var(--accent-red);color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:bold;">
                           ▶ Ver en YouTube
                        </a>
                    </div>
                </div>
                <script>
                    // Detectar Error 153 (embedding deshabilitado) via postMessage
                    window.addEventListener('message', function(e) {
                        if (e.data && e.data.event === 'infoDelivery' && e.data.info && e.data.info.error) {
                            document.getElementById('yt-iframe').style.display = 'none';
                            document.getElementById('yt-fallback').style.display = 'block';
                        }
                    });
                    // Fallback extra: si el iframe no carga en 4 segundos, mostrar botón
                    setTimeout(function() {
                        var iframe = document.getElementById('yt-iframe');
                        if (iframe) {
                            try {
                                var doc = iframe.contentDocument || iframe.contentWindow.document;
                                if (!doc || doc.readyState === 'loading') {}
                            } catch(e) { /* cross-origin es normal */ }
                        }
                    }, 4000);
                <\/script>`;
        }
        // No es YouTube — mostrar botón directo
        return `<div style="text-align:center; padding:30px; background:#111; border-radius:12px; border:1px solid #333;">
                    <a href="${url}" target="_blank" 
                       style="background:var(--accent-red);color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:bold;">
                       ▶ Ver Video
                    </a>
                </div>`;
    }

    function renderDetail(item) {
        const container = document.getElementById('detailContainer');
        const backBtn = '<a href="index.html" style="color: var(--accent-purple); text-decoration: none; display: block; margin-bottom: 20px;">← Volver</a>';
        
        if (type === 'band') {
            container.innerHTML = `
                ${backBtn}
                <div class="detail-header">
                    <img src="${imgUrl(item.foto_principal) || 'https://placehold.co/400x400/111/da0b0b?text=Sin+Foto'}" class="detail-img">
                    <div class="detail-info">
                        <h1>${item.nombre}</h1>
                        <div class="detail-meta">${item.genero || ''} | ${item.provincia || ''}</div>
                        <p>${item.biografia || ''}</p>
                    </div>
                </div>

                <h2 class="section-title">Video</h2>
                <div class="video-container" style="margin-top: 20px;">
                    ${item.video_url ? getYoutubeEmbed(item.video_url) : '<p>No hay video disponible.</p>'}
                </div>

                <h2 class="section-title">Fotos de la Banda</h2>
                <div class="content" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 20px;">
                    ${item.fotos && item.fotos.length > 0 ? item.fotos.map(f => `
                        <div class="photo-card" style="border: 1px solid #222; border-radius: 8px; overflow: hidden;">
                            <img src="${imgUrl(f.url)}" style="width: 100%; display: block; cursor: pointer;" onclick="window.open('${imgUrl(f.url)}', '_blank')">
                            <p style="font-size: 0.8rem; padding: 10px; margin: 0; color: #777;">${f.descripcion || ''}</p>
                        </div>
                    `).join('') : '<p>No hay fotos en la galería.</p>'}
                </div>

                <h2 class="section-title">Discografía</h2>
                <p style="margin-top: 15px;">${item.discografia || 'No disponible'}</p>
            `;
        } else if (type === 'story') {
            container.innerHTML = `
                ${backBtn}
                <h1>${item.titulo}</h1>
                <p class="detail-meta">Archivado - ${new Date(item.fecha).toLocaleDateString()}</p>
                <img src="${imgUrl(item.foto)}" style="max-width: 100%; border-radius: 12px; margin: 20px 0; border: 1px solid #333;">
                <div style="font-size: 1.1rem; line-height: 1.8; color: #ccc;">
                    ${item.contenido ? item.contenido.replace(/\n/g, '<br>') : ''}
                </div>
            `;
        } else if (type === 'place') {
            container.innerHTML = `
                ${backBtn}
                <h1>${item.nombre}</h1>
                <p style="font-size: 1.2rem; color: #999; margin-bottom: 30px;">${item.descripcion || ''}</p>
                <h2 class="section-title">Galería de Fotos</h2>
                <div class="content" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
                    ${item.fotos && item.fotos.length > 0 ? item.fotos.map(f => `
                        <div class="photo-card" style="border: 1px solid #222; border-radius: 8px; overflow: hidden;">
                            <img src="${imgUrl(f.url)}" style="width: 100%; display: block; cursor: pointer;" onclick="window.open('${imgUrl(f.url)}', '_blank')">
                            <p style="font-size: 0.8rem; padding: 10px; margin: 0; color: #777;">${f.descripcion || ''}</p>
                        </div>
                    `).join('') : '<p>No hay fotos en esta galería aún.</p>'}
                </div>
            `;
        }
    }

    window.onload = loadDetail;
</script>

</body>
</html>
